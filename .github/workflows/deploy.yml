name: build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deploy in flight. Cancelling one halfway can leave the site
  # serving a half-published build, and the run it would save is seconds.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must be new enough for unflagged WebAssembly JSPI, which the whole
          # sync-Python-over-async-HID design depends on. Node 24 is not.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Exercises stock Blinka against the software MCP2221 -- no hardware.
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Derived from the repository rather than hard-coded, so the site
          # works whatever the repo is called. A project page is served from
          # /<repo>/, but a user or organisation page (<owner>.github.io) is
          # served from the root -- getting this wrong is the classic "deploys
          # fine, loads a blank page" failure, because every asset 404s.
          BASE_PATH: >-
            ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner)
                && '/'
                || format('/{0}/', github.event.repository.name) }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
